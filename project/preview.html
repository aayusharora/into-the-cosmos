<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deck preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#15161a;font-family:'IBM Plex Sans',system-ui,sans-serif;padding:28px}
  h1{color:#e9e9ec;font-size:19px;font-weight:600;margin-bottom:6px}
  .note{color:#8b8d96;font-size:13px;margin-bottom:24px;line-height:1.5}
  .slot{margin-bottom:34px}
  .cap{color:#8b8d96;font-size:13px;font-family:'JetBrains Mono',monospace;margin-bottom:7px}
  .frame{position:relative;width:100%;overflow:hidden;border-radius:10px;
         border:1px solid #2c2e36;background:#000}
  .stage{width:1920px;height:1080px;transform-origin:top left}
  .stage > section{width:1920px;height:1080px;position:relative;display:flex}
  /* custom elements the deck runtime provides; stub them so layout holds */
  x-embed{display:block;background:#0d1322;border:1px dashed #2A3A66;border-radius:12px}
  x-icon{display:inline-block}
</style>
</head>
<body>
<h1 id="hd">Deck preview</h1>
<div class="note">
  Rendered from the same files the deck uses. Animated panels
  (<code>x-embed</code>) show as dashed placeholders here — they run in the real
  deck. Everything else is exactly what the audience sees.
</div>
<div id="out"></div>
<script>
(async () => {
  const bust = `?t=${Date.now()}`;
  const deck = await (await fetch('deck.json' + bust)).json();
  const out = document.getElementById('out');
  document.getElementById('hd').textContent =
    `Deck preview — ${deck.order.length} slides`;
  for (let i = 0; i < deck.order.length; i++) {
    const id = deck.order[i];
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.innerHTML = `<div class="cap">${String(i+1).padStart(2,'0')} · ${id}</div>
                      <div class="frame"><div class="stage"></div></div>`;
    out.appendChild(slot);
    const stage = slot.querySelector('.stage');
    try {
      let html = await (await fetch(`slides/${id}.html` + bust)).text();
      html = html.replace(/<aside>[\s\S]*?<\/aside>/g, '');
      stage.innerHTML = html;
    } catch (e) {
      stage.innerHTML = `<section style="background:#300;color:#fff;padding:60px;
        font-size:40px">failed to load ${id}</section>`;
    }
    const frame = slot.querySelector('.frame');
    const fit = () => {
      const s = frame.clientWidth / 1920;
      stage.style.transform = `scale(${s})`;
      frame.style.height = (1080 * s) + 'px';
    };
    fit();
    addEventListener('resize', fit);
  }
})();
</script>
</body>
</html>
