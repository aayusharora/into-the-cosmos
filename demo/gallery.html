<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worlds We Have Seen</title>
<style>
  :root{--bg:#070C18;--panel:#0E1526;--line:#2A3A66;--ink:#F2F4FA;--dim:#8D97B8;
        --cyan:#5AC8E8;--amber:#FFB454;--red:#FF6B5A}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%;background:var(--bg);color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:28px 32px 20px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:rgba(7,12,24,.96);z-index:10;backdrop-filter:blur(6px)}
  h1{font-size:26px;font-weight:700;letter-spacing:-.2px}
  .sub{font-size:14px;color:var(--dim);margin-top:5px}
  .controls{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
  input{flex:1;min-width:240px;padding:11px 14px;border-radius:10px;
    border:1px solid var(--line);background:#121B36;color:var(--ink);font-size:15px}
  input:focus{outline:none;border-color:var(--cyan)}
  button{padding:11px 16px;border-radius:10px;border:1px solid var(--line);
    background:#121B36;color:var(--ink);font-size:14px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--cyan)}
  .chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);
    background:#121B36;color:var(--dim);font-size:13px;cursor:pointer}
  .chip:hover{color:var(--ink);border-color:var(--cyan)}
  .chip.on{border-color:var(--amber);color:var(--amber)}
  .toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);
    cursor:pointer;user-select:none}
  #status{padding:14px 32px;font-size:14px;color:var(--dim);
    font-family:ui-monospace,Menlo,Consolas,monospace}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:18px;padding:8px 32px 48px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;cursor:zoom-in;transition:.15s}
  .card:hover{border-color:var(--cyan);transform:translateY(-2px)}
  .card img{width:100%;height:190px;object-fit:contain;background:#05080F;display:block}
  .meta{padding:11px 13px}
  .meta .t{font-size:14px;font-weight:600;line-height:1.3}
  .meta .d{font-size:12px;color:var(--dim);margin-top:4px;
    font-family:ui-monospace,Menlo,Consolas,monospace}
  .flag{display:inline-block;margin-top:6px;font-size:11px;color:var(--red);
    border:1px solid #4A2630;border-radius:5px;padding:1px 6px}
  #lightbox{position:fixed;inset:0;background:rgba(3,6,14,.97);z-index:50;
    display:none;flex-direction:column}
  #lightbox.on{display:flex}
  #lbtop{display:flex;justify-content:space-between;align-items:flex-start;
    gap:20px;padding:20px 26px;border-bottom:1px solid var(--line)}
  #lbtitle{font-size:19px;font-weight:700}
  #lbdesc{font-size:13px;color:var(--dim);margin-top:6px;max-width:980px;line-height:1.5}
  #lbid{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--cyan);margin-top:6px}
  #stage{flex:1;overflow:hidden;position:relative;cursor:grab;display:flex;
    align-items:center;justify-content:center}
  #stage.drag{cursor:grabbing}
  #stage img{max-width:92%;max-height:92%;transform-origin:center center;
    transition:transform .06s linear;user-select:none;-webkit-user-drag:none}
  #hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
    font-size:12px;color:var(--dim);background:rgba(14,21,38,.9);
    padding:7px 13px;border-radius:999px;border:1px solid var(--line)}
</style>
</head>
<body>

<header>
  <h1>Worlds we have seen</h1>
  <div class="sub">Live from NASA's image library. Photographs only &mdash; illustrations are flagged, not hidden from you.</div>
  <div class="controls">
    <input id="q" placeholder="Search anything: Europa, Titan surface, Great Red Spot, HR 8799&hellip;" />
    <button id="go">Search</button>
    <label class="toggle"><input type="checkbox" id="onlyphotos" checked> photographs only</label>
  </div>
  <div class="chips" id="chips"></div>
</header>

<div id="status">loading&hellip;</div>
<div id="grid"></div>

<div id="lightbox">
  <div id="lbtop">
    <div>
      <div id="lbtitle"></div>
      <div id="lbdesc"></div>
      <div id="lbid"></div>
    </div>
    <button id="lbclose">Close &times;</button>
  </div>
  <div id="stage"><img id="lbimg" alt="" /><div id="hint">scroll to zoom &middot; drag to pan &middot; Esc to close</div></div>
</div>

<script>
const API = "https://images-api.nasa.gov";

// Same test as build_gallery.py. The library mixes spacecraft photographs
// with artist's impressions, and the difference matters when the picture is
// your evidence.
const NOT_A_PHOTO = /\b(illustration|artist|artwork|concept|rendering|rendition|simulat|animation|infographic|poster|diagram|logo)\b/i;

// Pinned heroes. Searching and taking the first clean hit gave Pluto as an
// unresolved dot from 2006 — a real photograph, and not the one anyone means.
const PINNED = [
  ["Earth",   "as11-36-5337"], ["Mars",    "PIA01249"],
  ["Jupiter", "PIA21376"],     ["Saturn",  "PIA00400"],
  ["Uranus",  "PIA18182"],     ["Neptune", "PIA01492"],
  ["Pluto",   "PIA19857"],     ["HR 8799", "PIA17010"],
];

const $ = id => document.getElementById(id);
const grid = $("grid"), status = $("status");

function orig(href){ return href.replace(/~(thumb|small|medium)\./, "~orig."); }

function card(d, link){
  const drawing = NOT_A_PHOTO.test((d.title||"") + " " + (d.description||""));
  if (drawing && $("onlyphotos").checked) return null;

  const el = document.createElement("div");
  el.className = "card";
  const full = orig(link);
  el.innerHTML =
    `<img loading="lazy" src="${link}" alt="${(d.title||"").replace(/"/g,"&quot;")}">
     <div class="meta">
       <div class="t">${d.title || d.nasa_id}</div>
       <div class="d">${d.nasa_id} &middot; ${(d.date_created||"").slice(0,10)}</div>
       ${drawing ? '<span class="flag">illustration</span>' : ''}
     </div>`;
  el.onclick = () => open_lb(d, full, link);
  return el;
}

function render(items){
  grid.innerHTML = "";
  let shown = 0, hidden = 0;
  for (const it of items){
    const d = it.data && it.data[0];
    const link = it.links && it.links[0] && it.links[0].href;
    if (!d || !link) continue;
    const el = card(d, link);
    if (el){ grid.appendChild(el); shown++; } else hidden++;
  }
  status.textContent = `${shown} photograph${shown===1?"":"s"}` +
    (hidden ? `  ·  ${hidden} illustration${hidden===1?"":"s"} hidden` : "");
  if (!shown) status.textContent += "  ·  try naming the mission too, e.g. “Jupiter Juno”";
}

async function search(q){
  status.textContent = `searching “${q}” …`;
  try{
    const r = await fetch(`${API}/search?q=${encodeURIComponent(q)}&media_type=image`);
    if (!r.ok) throw new Error("HTTP " + r.status);
    render((await r.json()).collection.items);
  }catch(e){
    status.textContent = "search failed: " + e.message + "  ·  (NASA's API is occasionally flaky — try again)";
  }
}

async function loadPinned(){
  status.textContent = "loading the pinned eight …";
  const items = [];
  for (const [name, id] of PINNED){
    try{
      const r = await fetch(`${API}/search?nasa_id=${encodeURIComponent(id)}`);
      const j = await r.json();
      const it = j.collection.items[0];
      if (it){ it.data[0].title = name + " — " + it.data[0].title; items.push(it); }
    }catch(e){ /* one missing hero must not empty the page */ }
  }
  render(items);
  status.textContent = `${items.length} worlds · every one a photograph`;
}

// ---- lightbox with zoom and pan ----
let scale = 1, tx = 0, ty = 0, dragging = false, sx = 0, sy = 0;

function apply(){ $("lbimg").style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; }

function open_lb(d, full, fallback){
  $("lbtitle").textContent = d.title || d.nasa_id;
  $("lbdesc").textContent = (d.description || "").slice(0, 420);
  $("lbid").textContent = d.nasa_id + "  ·  " + (d.center || "NASA");
  const img = $("lbimg");
  img.onerror = () => { img.onerror = null; img.src = fallback; };
  img.src = full;
  img.alt = d.title || "";
  scale = 1; tx = 0; ty = 0; apply();
  $("lightbox").classList.add("on");
}

function close_lb(){ $("lightbox").classList.remove("on"); }

$("lbclose").onclick = close_lb;
document.addEventListener("keydown", e => { if (e.key === "Escape") close_lb(); });

const stage = $("stage");
stage.addEventListener("wheel", e => {
  e.preventDefault();
  scale = Math.min(8, Math.max(1, scale * (e.deltaY < 0 ? 1.12 : 0.89)));
  if (scale === 1){ tx = 0; ty = 0; }
  apply();
}, {passive:false});
stage.addEventListener("mousedown", e => { dragging = true; sx = e.clientX - tx; sy = e.clientY - ty; stage.classList.add("drag"); });
addEventListener("mouseup", () => { dragging = false; stage.classList.remove("drag"); });
addEventListener("mousemove", e => { if (dragging){ tx = e.clientX - sx; ty = e.clientY - sy; apply(); } });

// ---- wiring ----
PINNED.forEach(([name, id]) => {
  const c = document.createElement("div");
  c.className = "chip";
  c.textContent = name;
  c.onclick = () => search(name === "HR 8799" ? "HR 8799" : name + " spacecraft");
  $("chips").appendChild(c);
});
const home = document.createElement("div");
home.className = "chip on";
home.textContent = "★ the eight";
home.onclick = loadPinned;
$("chips").prepend(home);

$("go").onclick = () => { const v = $("q").value.trim(); if (v) search(v); };
$("q").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });
$("onlyphotos").onchange = () => { const v = $("q").value.trim(); v ? search(v) : loadPinned(); };

loadPinned();
</script>
</body>
</html>
